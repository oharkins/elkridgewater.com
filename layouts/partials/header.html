<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}" {{ if .IsHome }}aria-current="page"{{ end }}>
      <img
        class="brand__logo"
        src="{{ "images/brand/elk-ridge-logo.png" | relURL }}"
        alt=""
        width="720"
        height="720"
      />
      <span class="brand__name">Elk Ridge Water</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        {{- range site.Menus.main }}
          {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
          <li>
            <a href="{{ .URL }}" {{ if $active }}aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
        {{- end }}
        <li>
          <a class="site-nav__phone" href="tel:{{ site.Params.phoneHref }}">{{ site.Params.phone }}</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
