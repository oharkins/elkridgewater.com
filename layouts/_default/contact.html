{{ define "main" }}
  <article class="page">
    <header class="page__header">
      <div class="wrap">
        <h1 class="page__title">{{ .Title }}</h1>
        {{- with .Params.lede }}<p class="page__lede">{{ . }}</p>{{ end }}
      </div>
    </header>
    <div class="wrap contact-panel">
      {{ .Content }}
      <ul class="contact-list">
        <li>
          <span class="contact-list__label">Phone</span>
          <a href="tel:{{ site.Params.phoneHref }}">{{ site.Params.phone }}</a>
        </li>
        <li>
          <span class="contact-list__label">Email</span>
          <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
        </li>
        <li>
          <span class="contact-list__label">Location</span>
          <span>{{ site.Params.location }}</span>
        </li>
      </ul>
    </div>
  </article>
{{ end }}
